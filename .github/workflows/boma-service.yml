name: Boma service contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  quality:
    uses: bomander/boma-nu-registry/.github/workflows/service-quality.yml@main
    with:
      service: enkat
      runtime: laravel
      composer-path: '.'
      node-path: '.'
